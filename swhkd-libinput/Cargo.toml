[package]
name = "Simple-Wayland-HotKey-Daemon-Libinput"
version = "0.1.0"
edition = "2024"
description = "Sxhkd clone for Wayland (works on TYY and X11 too) using libinput"
authors = [
    "Mohammad Aadil Shabier <aadilshabier1@gmail.com>\n",
]

[dependencies]
env_logger = "0.9.0"
input = "0.9"
libc = "0.2"
log = "0.4.14"
nix = {version = "0.23"}
tokio = { version = "1.24.2", features = ["rt-multi-thread", "net", "macros"]}
uinput = "0.1.3"

[[bin]]
name = "swhkd_libinput"
path = "src/daemon.rs"
